name: shellcheck

on:
  push:
    paths:
      - "ha-check"
      - "examples/*.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "ha-check"
      - "examples/*.sh"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shellcheck 0.11.0
        run: pip install shellcheck-py==0.11.0.1
      - name: Run shellcheck
        run: |
          shopt -s nullglob
          shellcheck --version
          shellcheck -x ha-check examples/*.sh
